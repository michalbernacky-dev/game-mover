name: RPM Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:43

    steps:
      - name: Install build dependencies
        run: |
          dnf -y install \
            acl \
            git \
            gitleaks \
            ruff \
            python3-flask \
            python3-pam \
            python3-psutil \
            python3-qt5 \
            python3-requests \
            python3-pyyaml \
            rpm-build \
            rsync \
            tar \
            systemd-rpm-macros

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        run: gitleaks detect --source . --no-banner --redact

      - name: Run Python security checks
        run: ruff check game_mover*.py

      - name: Run complete test suite
        run: python3 -m unittest discover -v

      - name: Build RPM and SRPM
        run: |
          set -euo pipefail

          VERSION="$(awk '/^Version:/ {print $2; exit}' game-mover.spec)"
          if [ -z "$VERSION" ]; then
            echo "Unable to determine Version from game-mover.spec" >&2
            exit 1
          fi

          TOPDIR="$PWD/.rpmbuild"
          mkdir -p "$TOPDIR"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

          TMPDIR_SRC="$(mktemp -d)"
          PKGROOT="$TMPDIR_SRC/game-mover-${VERSION}"
          mkdir -p "$PKGROOT"

          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude '.vscode' \
            --exclude '__pycache__' \
            --exclude '.rpmbuild' \
            --exclude '*.pyc' \
            --exclude '*.bck' \
            ./ "$PKGROOT"/

          tar -C "$TMPDIR_SRC" -czf "$TOPDIR/SOURCES/game-mover-${VERSION}.tar.gz" "game-mover-${VERSION}"
          rm -rf "$TMPDIR_SRC"

          cp game-mover.spec "$TOPDIR/SPECS/"
          rpmbuild --define "_topdir $TOPDIR" -ba "$TOPDIR/SPECS/game-mover.spec"

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: game-mover-rpm
          path: |
            .rpmbuild/RPMS/**/*.rpm
            .rpmbuild/SRPMS/**/*.src.rpm
          if-no-files-found: error
